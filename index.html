<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thí Nghiệm Ảo: Nhận Biết Ion Ammonium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Custom Animations */
        @keyframes dropLiquid {
            0% { transform: translateY(-20px); opacity: 0; }
            50% { transform: translateY(50px); opacity: 1; }
            100% { transform: translateY(120px); opacity: 0; }
        }
        .animate-drop {
            animation: dropLiquid 1.5s ease-in-out forwards;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); opacity: 0.9; }
            50% { transform: scale(1.05) rotate(1deg); opacity: 1; }
        }
        .animate-flame {
            transform-origin: bottom center;
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-150px) translateX(var(--random-x)) scale(1.5); opacity: 0; }
        }
        .gas-particle {
            animation: riseUp 2s linear infinite;
        }

        /* Transitions */
        .color-transition {
            transition: all 1.5s ease-in-out;
        }

        .glow-blue {
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
        }

        /* Tool active state */
        .tool-active {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
            transition: all 0.2s;
        }

        /* Liquid level transitions */
        .liquid-level {
            transition: height 1s ease, y 1s ease, fill 1s ease;
        }

        /* Transform for Clamped Heating Step */
        .tilted-tube {
            transform-origin: 50% 90%;
            transform: translateY(-40px) rotate(20deg);
        }
        .shifted-burner {
            transform: translate(-30%, -25px);
        }

        /* Hide scrollbar for neatness */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800">

    <!-- Header -->

                                <div id="clamp-back-1" class="absolute top-[50px] -left-[95px] hidden z-10 flex items-center pointer-events-none">

                                        <rect x="83" y="6" width="6" height="18" fill="#94a3b8" rx="2"/>
                                    </svg>
                                </div>
                            </div>

                                        <path d="M 20 20 C 25 35, 30 45, 20 60 C 10 45, 15 35, 20 20 Z" fill="#ef4444" opacity="0.8" class="animate-flame" style="animation-delay: 0.1s;"/>
                                        <path d="M 20 35 C 23 45, 25 50, 20 60 C 15 50, 17 45, 20 35 Z" fill="#3b82f6" opacity="0.9" />
                                    </svg>
                                    <svg width="65" height="65" viewBox="0 0 60 70" class="filter drop-shadow-md relative z-30">
                                        <rect x="10" y="30" width="40" height="35" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
                                        <path d="M 5 65 L 55 65" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
                                        <path d="M 25 30 L 25 10 L 35 10 L 35 30 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
                                        <ellipse cx="30" cy="10" rx="10" ry="3" fill="#94a3b8"/>
                                        <rect x="29" y="5" width="2" height="5" fill="#475569"/>
                                        <rect x="15" y="40" width="30" height="20" fill="#bae6fd" opacity="0.6"/>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Cụm Ống nghiệm 2: NH4Cl -->
                        <div class="relative flex flex-col items-center w-[56px] shrink-0">
                            <!-- Ống nghiệm -->
                            <div class="relative flex flex-col items-center group cursor-pointer transition-all duration-1000 z-10" id="tube-2" onclick="handleTargetClick('tube2')">
                                
                                <!-- Kẹp gỗ (Ngàm sau) -->
                                <div id="clamp-back-2" class="absolute top-[50px] -left-[95px] hidden z-10 flex items-center pointer-events-none">
                                    <svg width="120" height="30" viewBox="0 0 120 30">
                                        <rect x="0" y="10" width="90" height="10" fill="#78350f" rx="2"/>
                                        <path d="M 80 2 L 115 2 C 120 2 120 28 115 28 L 80 28 Z" fill="#92400e"/>
                                    </svg>
                                </div>

                                <!-- Vùng tương tác -->
                                <div class="absolute -top-6 w-20 h-16 border-2 border-dashed border-transparent rounded-lg flex items-center justify-center transition-colors z-40" id="target-mouth-2"></div>

                                <!-- Bọt khí xuất phát từ đáy -->
                                <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-8 h-40 overflow-visible pointer-events-none z-30" id="gas-container-2"></div>

                                <!-- Nhỏ giọt -->
                                <div class="absolute -top-16 w-8 h-20 hidden z-50" id="drop-anim-2">
                                    <svg viewBox="0 0 20 40"><path d="M10 0 C 15 15, 20 20, 10 40 C 0 20, 5 15, 10 0 Z" fill="rgba(255,255,255,0.6)" class="animate-drop"/></svg>
                                </div>

                                <!-- Giấy pH 2 -->
                                <div id="ph-result-2" class="absolute -top-4 left-1/2 transform -translate-x-1/2 hidden flex-col items-center z-50 pointer-events-none">
                                    <div id="ph-strip-2" class="w-7 h-20 bg-[#fbbf24] rounded-sm shadow-md border border-gray-600 relative overflow-hidden transition-colors duration-1000">
                                        <div class="absolute bottom-0 w-full h-5 bg-black opacity-10 border-t border-gray-700"></div>
                                    </div>
                                </div>

                                <!-- SVG Ống nghiệm -->
                                <svg width="56" height="280" viewBox="0 0 56 280" class="shrink-0 drop-shadow-xl z-20 overflow-visible">
                                    <ellipse cx="28" cy="15" rx="20" ry="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
                                    <rect id="liquid-2" x="10" y="180" width="36" height="96" rx="18" fill="rgba(255,255,255,0.15)" class="liquid-level" />
                                    <path d="M 8 15 L 8 260 A 20 20 0 0 0 48 260 L 48 15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
                                    <path d="M 8 15 A 20 6 0 0 0 48 15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
                                    <path d="M 14 30 L 14 240" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
                                </svg>

                                <!-- Kẹp gỗ (Ngàm trước, z-30 để đè lên ống) -->
                                <div id="clamp-front-2" class="absolute top-[50px] -left-[95px] hidden z-30 flex items-center pointer-events-none">
                                    <svg width="120" height="30" viewBox="0 0 120 30">
                                        <path d="M 85 0 L 105 0 C 112 0 112 30 105 30 L 85 30 Z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
                                        <rect x="83" y="6" width="6" height="18" fill="#94a3b8" rx="2"/>
                                    </svg>
                                </div>
                            </div>
                            
                            <!-- Đèn cồn 2 -->
                            <div id="burner-area-2" class="absolute -bottom-[50px] left-1/2 transform -translate-x-1/2 hidden opacity-0 transition-all duration-1000 flex-col items-center z-0">
                                <div class="relative cursor-pointer transition-transform hover:scale-105" onclick="toggleBurner(2)">
                                    <svg width="40" height="50" viewBox="0 0 40 60" class="absolute bottom-[55px] left-1/2 transform -translate-x-1/2 hidden flame-svg-2 z-40">
                                        <path d="M 20 0 C 30 20, 40 40, 20 60 C 0 40, 10 20, 20 0 Z" fill="#fbbf24" opacity="0.6" class="animate-flame"/>
                                        <path d="M 20 20 C 25 35, 30 45, 20 60 C 10 45, 15 35, 20 20 Z" fill="#ef4444" opacity="0.8" class="animate-flame" style="animation-delay: 0.1s;"/>
                                        <path d="M 20 35 C 23 45, 25 50, 20 60 C 15 50, 17 45, 20 35 Z" fill="#3b82f6" opacity="0.9" />
                                    </svg>
                                    <svg width="65" height="65" viewBox="0 0 60 70" class="filter drop-shadow-md relative z-30">
                                        <rect x="10" y="30" width="40" height="35" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
                                        <path d="M 5 65 L 55 65" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
                                        <path d="M 25 30 L 25 10 L 35 10 L 35 30 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
                                        <ellipse cx="30" cy="10" rx="10" ry="3" fill="#94a3b8"/>
                                        <rect x="29" y="5" width="2" height="5" fill="#475569"/>
                                        <rect x="15" y="40" width="30" height="20" fill="#bae6fd" opacity="0.6"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Lớp ngoài cùng: Thanh ngang phía trước và Nhãn dán của Giá Inox (Z-20) -->
                    <svg id="rack-front" class="absolute bottom-[170px] left-1/2 transform -translate-x-1/2 w-[280px] h-[50px] z-20 transition-opacity duration-700 pointer-events-none" viewBox="0 0 280 50">
                        <rect x="15" y="10" width="250" height="12" fill="#e2e8f0" stroke="#94a3b8" rx="2"/>
                        <ellipse cx="78" cy="16" rx="14" ry="4" fill="#cbd5e1" stroke="#94a3b8"/>
                        <ellipse cx="204" cy="16" rx="14" ry="4" fill="#cbd5e1" stroke="#94a3b8"/>
                        <rect x="53" y="28" width="50" height="16" fill="white" stroke="#64748b" rx="2"/>
                        <text x="78" y="39" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">KNO₃</text>
                        <rect x="179" y="28" width="50" height="16" fill="white" stroke="#64748b" rx="2"/>
                        <text x="204" y="39" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">NH₄Cl</text>

                </div>
            </div>

            <!-- Tool Rack (Bottom) -->

                <div class="absolute -top-3 left-4 text-[9px] md:text-[10px] font-bold text-gray-500 bg-gray-50 px-2 border border-gray-200 rounded">DỤNG CỤ</div>
                
                <!-- Dropper / NaOH -->
                <div class="flex flex-col items-center cursor-pointer p-1 md:p-2 rounded-lg hover:bg-gray-100 transition-colors" id="tool-naoh" onclick="selectTool('naoh')">
                    <div class="relative transform scale-75 md:scale-100">
                        <svg width="50" height="70" viewBox="0 0 50 70">
                            <path d="M15 20 L 15 10 L 35 10 L 35 20 L 45 30 L 45 65 A 5 5 0 0 1 40 70 L 10 70 A 5 5 0 0 1 5 65 L 5 30 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
                            <rect x="10" y="40" width="30" height="25" fill="#e0f2fe" opacity="0.5"/>
                            <rect x="13" y="35" width="24" height="15" fill="white" stroke="#cbd5e1" rx="2"/>
                            <text x="25" y="45" font-size="8" font-weight="bold" fill="black" text-anchor="middle">NaOH</text>
                            <text x="25" y="53" font-size="7" font-weight="bold" fill="red" text-anchor="middle">20%</text>
                            <path d="M 18 10 L 18 5 A 7 7 0 0 1 32 5 L 32 10" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>

                    <span class="text-[10px] md:text-xs mt-0 md:mt-1 font-medium text-gray-700">D.dịch NaOH</span>
                </div>

                <!-- Clamp Tool -->

                    </div>
                    <span class="text-[10px] md:text-xs mt-0 md:mt-1 font-medium text-gray-700">Kẹp gỗ</span>
                </div>

                <!-- pH Paper Tool 1 -->
                <div class="flex flex-col items-center cursor-pointer p-1 md:p-2 rounded-lg hover:bg-gray-100 transition-colors opacity-50 pointer-events-none" id="tool-ph1" onclick="selectTool('ph1')">
                    <div class="transform scale-75 md:scale-100">
                        <svg width="40" height="50" viewBox="0 0 40 50">
                            <rect x="15" y="10" width="10" height="30" fill="#fbbf24" rx="1" stroke="#d97706" stroke-width="1"/>
                            <path d="M 10 30 Q 20 40 30 30" stroke="#3b82f6" fill="none" stroke-width="2" opacity="0.5"/>
                        </svg>
                    </div>
                    <span class="text-[10px] md:text-xs mt-0 md:mt-1 font-medium text-gray-700 text-center leading-tight">Giấy pH<br>(Ống 1)</span>
                </div>

                <!-- pH Paper Tool 2 -->
                <div class="flex flex-col items-center cursor-pointer p-1 md:p-2 rounded-lg hover:bg-gray-100 transition-colors opacity-50 pointer-events-none" id="tool-ph2" onclick="selectTool('ph2')">
                    <div class="transform scale-75 md:scale-100">
                        <svg width="40" height="50" viewBox="0 0 40 50">
                            <rect x="15" y="10" width="10" height="30" fill="#fbbf24" rx="1" stroke="#d97706" stroke-width="1"/>
                            <path d="M 10 30 Q 20 40 30 30" stroke="#3b82f6" fill="none" stroke-width="2" opacity="0.5"/>

                    </div>

                </div>
            </div>
        </div>

        <!-- Right Panel: Instructions & Interactions (1/3 width) -->
        <div class="w-full h-[40%] md:w-1/3 md:h-full bg-white flex flex-col">
            <div class="p-4 md:p-6 flex-1 overflow-y-auto" id="instruction-panel">
                <!-- Content injected by JS -->
            </div>
            
            <div class="p-3 md:p-6 bg-gray-50 border-t border-gray-200 shadow-inner flex flex-col gap-2 md:gap-3 shrink-0">
                <button id="btn-next-step" onclick="nextStep()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 md:py-3 px-4 rounded-xl shadow transition-colors flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed text-sm md:text-base">
                    Bắt đầu thí nghiệm
                    <svg class="w-4 h-4 md:w-5 md:h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                <button id="btn-retry-step" onclick="retryStep()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1.5 md:py-2 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center hidden text-sm md:text-base">
                    <svg class="w-3 h-3 md:w-4 md:h-4 ml-1 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Làm lại bước này
                </button>
            </div>
        </div>

    </main>

    <script>
        const STEPS = [
            { id: 1, title: "Chuẩn bị", reqNext: true },
            { id: 2, title: "Thêm NaOH", reqNext: false }, 
            { id: 3, title: "Đun nóng", reqNext: false },
            { id: 4, title: "Thử pH", reqNext: false },
            { id: 5, title: "Bài tập", reqNext: false }
        ];

        const state = {
            step: 0,
            timer: 0,
            timerInterval: null,
            selectedTool: null,
            interactions: {
                naohTube1: false,
                naohTube2: false,
                isHeated1: false,
                isHeated2: false,
                phTube1: false,
                phTube2: false
            },
            quizAnswers: {}
        };

        const DOM = {
            progressContainer: document.getElementById('progress-container'),
            instructionPanel: document.getElementById('instruction-panel'),
            btnNext: document.getElementById('btn-next-step'),
            btnRetry: document.getElementById('btn-retry-step'),
            labMessage: document.getElementById('lab-message'),
            timer: document.getElementById('timer'),
            
            tools: {
                naoh: document.getElementById('tool-naoh'),
                clamp: document.getElementById('tool-clamp'),
                ph1: document.getElementById('tool-ph1'),
                ph2: document.getElementById('tool-ph2')
            },
            
            tube1: document.getElementById('tube-1'),
            tube2: document.getElementById('tube-2'),
            liquid1: document.getElementById('liquid-1'),
            liquid2: document.getElementById('liquid-2'),
            burnerArea1: document.getElementById('burner-area-1'),
            burnerArea2: document.getElementById('burner-area-2'),
            flameSvg1: document.querySelector('.flame-svg-1'),
            flameSvg2: document.querySelector('.flame-svg-2'),
            target1: document.getElementById('target-mouth-1'),
            target2: document.getElementById('target-mouth-2'),
            gasContainer: document.getElementById('gas-container-2'),
            phResult1: document.getElementById('ph-result-1'),
            phResult2: document.getElementById('ph-result-2'),
            phStrip2: document.getElementById('ph-strip-2'),
            rackBack: document.getElementById('rack-back'),
            rackFront: document.getElementById('rack-front')
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        const startTimer = () => {
            if (!state.timerInterval) {
                state.timerInterval = setInterval(() => {
                    state.timer++;
                    DOM.timer.innerText = formatTime(state.timer);
                }, 1000);
            }
        };
        const stopTimer = () => {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        };

        const showMessage = (msg, isError = false) => {
            DOM.labMessage.innerText = msg;
            DOM.labMessage.className = `absolute top-8 text-center px-6 py-3 rounded-xl shadow-lg text-lg font-semibold z-50 max-w-md border transition-opacity duration-300 pointer-events-none ${isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`;
            DOM.labMessage.style.opacity = 1;
            setTimeout(() => {
                DOM.labMessage.style.opacity = 0;
            }, 3000);
        };

        const renderProgress = () => {
            DOM.progressContainer.innerHTML = STEPS.map((s, index) => {
                const isActive = s.id === state.step;
                const isPast = s.id < state.step;
                let circleClass = "w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border-2 shrink-0 ";
                let lineClass = "h-1 w-6 mx-2 rounded shrink-0 ";
                let textClass = "text-[11px] font-semibold mt-1 whitespace-nowrap ";

                if (isActive) {
                    circleClass += "bg-blue-600 text-white border-blue-600 shadow-md";
                    textClass += "text-blue-700";
                    lineClass += "bg-gray-200";
                } else if (isPast) {
                    circleClass += "bg-green-500 text-white border-green-500";
                    textClass += "text-green-600";
                    lineClass += "bg-green-500";
                } else {
                    circleClass += "bg-white text-gray-400 border-gray-300";
                    textClass += "text-gray-400";
                    lineClass += "bg-gray-200";
                }

                const line = index < STEPS.length - 1 ? `<div class="${lineClass}"></div>` : '';
                return `
                    <div class="flex items-center">
                        <div class="flex flex-col items-center">
                            <div class="${circleClass}">${isPast ? '✓' : s.id}</div>
                            <span class="${textClass}">${s.title}</span>
                        </div>
                        ${line}
                    </div>
                `;
            }).join('');
        };

        const unlockNext = () => {
            DOM.btnNext.disabled = false;
            DOM.btnNext.classList.remove('opacity-50', 'cursor-not-allowed');
            DOM.btnNext.classList.add('animate-pulse');
            setTimeout(() => DOM.btnNext.classList.remove('animate-pulse'), 2000);
        };

        const lockNext = () => {
            DOM.btnNext.disabled = true;
            DOM.btnNext.classList.add('opacity-50', 'cursor-not-allowed');
        };

        const updateToolState = () => {
            Object.values(DOM.tools).forEach(t => {
                t.classList.remove('tool-active');
                t.classList.add('opacity-50', 'pointer-events-none');
            });
            DOM.target1.classList.remove('border-blue-400', 'bg-blue-50');
            DOM.target2.classList.remove('border-blue-400', 'bg-blue-50');
            DOM.target1.classList.add('border-transparent');
            DOM.target2.classList.add('border-transparent');

            if (state.step === 2) {
                DOM.tools.naoh.classList.remove('opacity-50', 'pointer-events-none');
                if (state.selectedTool === 'naoh') {
                    DOM.tools.naoh.classList.add('tool-active');
                    if (!state.interactions.naohTube1) {
                        DOM.target1.classList.replace('border-transparent', 'border-blue-400');
                        DOM.target1.classList.add('bg-blue-50', 'bg-opacity-20');
                    }
                    if (!state.interactions.naohTube2) {
                        DOM.target2.classList.replace('border-transparent', 'border-blue-400');
                        DOM.target2.classList.add('bg-blue-50', 'bg-opacity-20');
                    }
                }
            } else if (state.step === 3) {
                DOM.tools.clamp.classList.remove('opacity-50', 'pointer-events-none');
                if (state.selectedTool === 'clamp') DOM.tools.clamp.classList.add('tool-active');
            } else if (state.step === 4) {
                if(!state.interactions.phTube1) DOM.tools.ph1.classList.remove('opacity-50', 'pointer-events-none');
                if(!state.interactions.phTube2) DOM.tools.ph2.classList.remove('opacity-50', 'pointer-events-none');
                
                if (state.selectedTool === 'ph1') {
                    DOM.tools.ph1.classList.add('tool-active');
                    DOM.target1.classList.replace('border-transparent', 'border-blue-400');
                    DOM.target1.classList.add('bg-blue-50', 'bg-opacity-20');
                }
                if (state.selectedTool === 'ph2') {
                    DOM.tools.ph2.classList.add('tool-active');
                    DOM.target2.classList.replace('border-transparent', 'border-blue-400');
                    DOM.target2.classList.add('bg-blue-50', 'bg-opacity-20');
                }
            }
        };

        const selectTool = (toolId) => {
            if (state.selectedTool === toolId) {
                state.selectedTool = null; 
            } else {
                state.selectedTool = toolId;
                if(toolId === 'naoh') showMessage("Đã chọn dung dịch NaOH. Hãy nhấp vào các miệng ống nghiệm để nhỏ.");
                if(toolId === 'clamp') showMessage("Đã chọn kẹp gỗ. Hãy nhấp vào thân ống nghiệm để kẹp.");
                if(toolId === 'ph1') showMessage("Đã chọn giấy pH cho ống 1. Nhấp vào miệng ống 1.");
                if(toolId === 'ph2') showMessage("Đã chọn giấy pH cho ống 2. Nhấp vào miệng ống 2.");
            }
            updateToolState();
        };

        const handleTargetClick = (tubeId) => {
            const isTube1 = tubeId === 'tube1';
            
            // Action: Add NaOH
            if (state.step === 2 && state.selectedTool === 'naoh') {
                if (isTube1 && !state.interactions.naohTube1) {
                    playDropAnimation(1);
                    state.interactions.naohTube1 = true;
                } else if (!isTube1 && !state.interactions.naohTube2) {
                    playDropAnimation(2);
                    state.interactions.naohTube2 = true;
                } else {
                    showMessage("Đã nhỏ NaOH vào ống này rồi.", true);
                    return;
                }
                state.selectedTool = null;
                updateToolState();
                
                if (state.interactions.naohTube1 && state.interactions.naohTube2) {
                    setTimeout(() => {
                        showMessage("Đã hoàn thành thêm NaOH vào cả hai ống nghiệm.");
                        unlockNext();
                        renderInstruction();
                    }, 2000);
                }
            }
            
            // Action: Prep Burners & Clamps (Chuẩn bị Đun nóng)
            else if (state.step === 3 && state.selectedTool === 'clamp') {
                // Làm mờ giá để ống nghiệm (tạo cảm giác nhấc ống ra khỏi giá)
                DOM.rackBack.style.opacity = '0';
                DOM.rackFront.style.opacity = '0';

                // Hiển thị kẹp gỗ bám vào ống nghiệm (bao gồm cả ngàm trước và ngàm sau)
                document.getElementById('clamp-back-1').classList.remove('hidden');
                document.getElementById('clamp-front-1').classList.remove('hidden');
                document.getElementById('clamp-back-2').classList.remove('hidden');
                document.getElementById('clamp-front-2').classList.remove('hidden');

                // Nghiêng ống nghiệm 20 độ từ đáy
                DOM.tube1.classList.add('tilted-tube');
                DOM.tube2.classList.add('tilted-tube');

                // Hiển thị đèn cồn và dịch chuyển theo đáy
                DOM.burnerArea1.classList.remove('hidden');
                DOM.burnerArea2.classList.remove('hidden');
                setTimeout(() => {
                    DOM.burnerArea1.classList.remove('opacity-0');
                    DOM.burnerArea2.classList.remove('opacity-0');
                    DOM.burnerArea1.classList.add('shifted-burner');
                    DOM.burnerArea2.classList.add('shifted-burner');
                }, 100);
                
                state.selectedTool = null;
                updateToolState();
                showMessage("Đã nhấc và kẹp ống nghiệm. Hãy nhấp vào từng đèn cồn để đun nóng.");
                renderInstruction();
            }

            // Action: pH Paper
            else if (state.step === 4) {
                if (isTube1 && state.selectedTool === 'ph1') {
                    DOM.phResult1.classList.remove('hidden');
                    DOM.phResult1.classList.add('flex');
                    state.interactions.phTube1 = true;
                    state.selectedTool = null;
                    showMessage("Đã đưa giấy pH vào miệng ống 1.");
                } else if (!isTube1 && state.selectedTool === 'ph2') {
                    DOM.phResult2.classList.remove('hidden');
                    DOM.phResult2.classList.add('flex');
                    state.interactions.phTube2 = true;
                    state.selectedTool = null;
                    
                    setTimeout(() => {
                        DOM.phStrip2.classList.replace('bg-[#fbbf24]', 'bg-blue-800'); 
                        DOM.phStrip2.classList.replace('border-gray-600', 'border-blue-900');
                        DOM.phStrip2.classList.add('glow-blue');
                    }, 800);
                } else if (state.selectedTool) {
                    showMessage("Hãy đặt đúng loại giấy pH vào đúng ống nghiệm tương ứng.", true);
                }
                
                updateToolState();
                if (state.interactions.phTube1 && state.interactions.phTube2) {
                    setTimeout(() => unlockNext(), 2000);
                }
            }
        };

        const playDropAnimation = (tubeNum) => {
            const animDiv = document.getElementById(`drop-anim-${tubeNum}`);
            const liquid = document.getElementById(`liquid-${tubeNum}`);
            animDiv.classList.remove('hidden');
            
            setTimeout(() => {
                animDiv.classList.add('hidden');
                let currentHeight = parseFloat(liquid.getAttribute('height'));
                let currentY = parseFloat(liquid.getAttribute('y'));
                liquid.setAttribute('height', currentHeight + 20); // Thành 116
                liquid.setAttribute('y', currentY - 20); // Kéo y lên cao hơn 20px
                liquid.setAttribute('fill', 'rgba(255,255,255,0.3)'); // Trắng mờ đậm hơn khi thêm NaOH
            }, 1500);
        };

        const toggleBurner = (tubeNum) => {
            if (state.step === 3 && !state.interactions[`isHeated${tubeNum}`]) {
                state.interactions[`isHeated${tubeNum}`] = true;
                
                if (tubeNum === 1) {
                    DOM.flameSvg1.classList.remove('hidden');
                    showMessage("Đang đun nóng ống nghiệm 1...");
                } else {
                    DOM.flameSvg2.classList.remove('hidden');
                    showMessage("Đang đun nóng ống nghiệm 2...");
                    setTimeout(() => {
                        startGasAnimation();
                        showMessage("Có bọt khí li ti thoát ra ở ống nghiệm 2.");
                    }, 1500);
                }
                
                if (state.interactions.isHeated1 && state.interactions.isHeated2) {
                    setTimeout(() => {
                        unlockNext();
                    }, 2500);
                }
            }
        };

        const startGasAnimation = () => {
            for(let i=0; i<20; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'absolute bottom-0 left-1/2 w-2 h-2 bg-gray-200 rounded-full gas-particle opacity-0';
                    particle.style.setProperty('--random-x', `${(Math.random() - 0.5) * 40}px`);
                    particle.style.animationDelay = `${Math.random() * 2}s`;
                    DOM.gasContainer.appendChild(particle);
                }, i * 200);
            }
        };

        const renderInstruction = () => {
            const panel = DOM.instructionPanel;
            let content = '';
            const btnSvg = `<svg class="w-4 h-4 md:w-5 md:h-5 ml-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;

            switch (state.step) {
                case 1:
                    content = `
                        <div class="animate-fade-in">
                            <h2 class="text-lg md:text-xl font-bold text-blue-800 mb-3 md:mb-4 border-b pb-2">Bước 1: Chuẩn bị</h2>
                            <p class="text-gray-700 mb-3 md:mb-4 text-sm md:text-base leading-relaxed">
                                Trên giá để ống nghiệm có sẵn hai dung dịch trong suốt, không màu:
                            </p>
                            <ul class="list-disc pl-5 md:pl-6 mb-4 md:mb-6 text-sm md:text-base text-gray-700 space-y-1 md:space-y-2">
                                <li><strong>Ống (1):</strong> Dung dịch Potassium nitrate <span class="font-mono bg-gray-100 px-1 rounded text-xs md:text-sm text-blue-600">KNO₃</span>.</li>
                                <li><strong>Ống (2):</strong> Dung dịch Ammonium chloride <span class="font-mono bg-gray-100 px-1 rounded text-xs md:text-sm text-blue-600">NH₄Cl</span>.</li>
                            </ul>
                            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 md:p-4 rounded text-xs md:text-sm text-blue-800 shadow-sm">
                                <strong>Nhiệm vụ:</strong> Quan sát trạng thái ban đầu của hai dung dịch, sau đó nhấn "Tiếp tục" để bắt đầu tiến hành thí nghiệm.
                            </div>
                        </div>
                    `;
                    unlockNext();
                    DOM.btnNext.innerHTML = `Tiếp tục ${btnSvg}`;
                    break;
                case 2:
                    content = `
                        <div class="animate-fade-in">
                            <h2 class="text-lg md:text-xl font-bold text-blue-800 mb-3 md:mb-4 border-b pb-2">Bước 2: Thêm dung dịch NaOH</h2>
                            <p class="text-gray-700 mb-3 md:mb-4 text-sm md:text-base leading-relaxed">
                                Ta sẽ cho dung dịch kiềm mạnh tác dụng với hai muối trên.
                            </p>
                            <div class="bg-yellow-50 border border-yellow-200 p-3 md:p-4 rounded-lg mb-3 md:mb-4 shadow-sm">
                                <h3 class="font-bold text-yellow-800 mb-2 text-sm md:text-base">Thao tác:</h3>
                                <ol class="list-decimal pl-5 text-gray-700 space-y-1 md:space-y-2 text-sm md:text-base">
                                    <li>Nhấp chuột chọn chai <strong>D.dịch NaOH</strong> ở khay dụng cụ.</li>
                                    <li>Nhấp chuột vào <strong>miệng ống nghiệm (1)</strong> để nhỏ vài giọt.</li>
                                    <li>Nhấp chuột vào <strong>miệng ống nghiệm (2)</strong> để nhỏ vài giọt.</li>
                                </ol>
                            </div>
                            
                            <div class="mt-2 md:mt-4 text-xs md:text-sm ${state.interactions.naohTube1 && state.interactions.naohTube2 ? 'text-green-600 font-bold' : 'text-gray-500'}">
                                ${state.interactions.naohTube1 && state.interactions.naohTube2 ? '✓ Đã hoàn thành thao tác.' : '⌛ Đang chờ bạn thực hiện thao tác...'}
                            </div>
                        </div>
                    `;
                    DOM.btnNext.innerHTML = `Tiếp tục ${btnSvg}`;
                    break;
                case 3:
                    content = `
                        <div class="animate-fade-in">
                            <h2 class="text-lg md:text-xl font-bold text-blue-800 mb-3 md:mb-4 border-b pb-2">Bước 3: Đun nóng nhẹ</h2>
                            <p class="text-gray-700 mb-3 md:mb-4 text-sm md:text-base leading-relaxed">
                                Đun nóng nhẹ cả 2 ống nghiệm để kích thích phản ứng xảy ra nhanh hơn và quan sát hiện tượng khí bay lên.
                            </p>
                            <div class="bg-yellow-50 border border-yellow-200 p-3 md:p-4 rounded-lg mb-3 md:mb-4 shadow-sm">
                                <h3 class="font-bold text-yellow-800 mb-2 text-sm md:text-base">Thao tác:</h3>
                                <ol class="list-decimal pl-5 text-gray-700 space-y-1 md:space-y-2 text-sm md:text-base">
                                    <li>Chọn <strong>Kẹp gỗ</strong> (nhấp vào bất kỳ ống nghiệm nào để nhấc cả hai ra khỏi giá).</li>
                                    <li class="${(!DOM.burnerArea1.classList.contains('hidden')) ? 'font-bold text-blue-700' : ''}">Nhấp vào <strong>từng chiếc đèn cồn</strong> bên dưới để bật lửa.</li>
                                </ol>
                            </div>
                        </div>
                    `;
                    DOM.btnNext.innerHTML = `Tiếp tục ${btnSvg}`;
                    break;
                case 4:
                    content = `
                        <div class="animate-fade-in">
                            <h2 class="text-lg md:text-xl font-bold text-blue-800 mb-3 md:mb-4 border-b pb-2">Bước 4: Thử khí bằng giấy pH ẩm</h2>
                            <p class="text-gray-700 mb-3 md:mb-4 text-sm md:text-base leading-relaxed">
                                Để kiểm tra tính chất của khí vừa sinh ra, ta dùng giấy pH đã được làm ẩm bằng nước cất đặt lên miệng ống nghiệm.
                            </p>
                            <div class="bg-yellow-50 border border-yellow-200 p-3 md:p-4 rounded-lg mb-3 md:mb-4 shadow-sm">
                                <h3 class="font-bold text-yellow-800 mb-2 text-sm md:text-base">Thao tác:</h3>
                                <ol class="list-decimal pl-5 text-gray-700 space-y-1 md:space-y-2 text-sm md:text-base">
                                    <li>Chọn <strong>Giấy pH ẩm (ống 1)</strong> và nhấp vào miệng ống (1).</li>
                                    <li>Chọn <strong>Giấy pH ẩm (ống 2)</strong> và nhấp vào miệng ống (2).</li>
                                </ol>
                            </div>
                            <div class="mt-2 md:mt-4 text-xs md:text-sm ${state.interactions.phTube1 && state.interactions.phTube2 ? 'text-green-600 font-bold' : 'text-gray-500'}">
                                ${state.interactions.phTube1 && state.interactions.phTube2 ? '✓ Đã đưa giấy pH vào hai miệng ống. Hãy quan sát sự thay đổi màu sắc.' : '⌛ Chờ thực hiện thao tác...'}
                            </div>
                        </div>
                    `;
                    DOM.btnNext.innerHTML = `Làm bài tập ${btnSvg}`;
                    break;
                case 5:
                    renderQuiz();
                    return; 
            }
            
            panel.innerHTML = content;
            DOM.btnRetry.classList.toggle('hidden', state.step === 1 || state.step >= 5);
        };

        const quizQuestions = [
            {
                q: "Khí sinh ra từ phản ứng làm giấy pH ẩm đổi màu là khí nào?",
                options: ["Khí Nitrogen (N₂)", "Khí Oxygen (O₂)", "Khí Ammonia (NH₃)", "Khí Carbon dioxide (CO₂)"],
                ans: 2
            },
            {
                q: "Phương trình ion rút gọn chứng minh sự có mặt của ion Ammonium là:",
                options: [
                    "NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺",
                    "NH₄⁺ + OH⁻ → NH₃↑ + H₂O",
                    "NH₄⁺ → N₂ + 4H⁺",
                    "NH₃ + HCl → NH₄Cl"
                ],
                ans: 1
            }
        ];

        const renderQuiz = () => {
            let qHtml = `<div class="animate-fade-in"><h2 class="text-lg md:text-xl font-bold text-blue-800 mb-3 md:mb-4 border-b pb-2">Bài tập củng cố</h2>`;
            
            quizQuestions.forEach((q, qIndex) => {
                qHtml += `
                    <div class="mb-4 md:mb-6 bg-white p-3 md:p-4 rounded-lg border border-gray-200 shadow-sm">
                        <p class="font-semibold text-sm md:text-base text-gray-800 mb-2 md:mb-3">${qIndex + 1}. ${q.q}</p>
                        <div class="space-y-2">
                `;
                q.options.forEach((opt, oIndex) => {
                    const isSelected = state.quizAnswers[qIndex] === oIndex;
                    const isAnswered = state.quizAnswers[qIndex] !== undefined;
                    const isCorrectOption = q.ans === oIndex;

                    let borderClass = 'hover:bg-gray-50 border-gray-300';
                    let iconHtml = '';

                    // Logic hiển thị Đúng/Sai tức thời
                    if (isAnswered) {
                        if (isSelected) {
                            if (isCorrectOption) {
                                borderClass = 'bg-green-50 border-green-500';
                                iconHtml = '<span class="ml-auto text-green-600 font-bold text-xs md:text-sm bg-green-100 px-2 py-1 rounded shrink-0">✓ Đúng</span>';
                            } else {
                                borderClass = 'bg-red-50 border-red-500';
                                iconHtml = '<span class="ml-auto text-red-600 font-bold text-xs md:text-sm bg-red-100 px-2 py-1 rounded shrink-0">✗ Sai</span>';
                            }
                        } else if (isCorrectOption) {
                            iconHtml = '<span class="ml-auto text-green-600 font-bold text-xs md:text-sm opacity-60 shrink-0">✓ Đáp án</span>';
                        }
                    }

                    qHtml += `
                        <label class="flex items-center p-2 md:p-3 border rounded-lg cursor-pointer transition-colors ${borderClass}">
                            <input type="radio" name="q${qIndex}" value="${oIndex}" class="w-3 h-3 md:w-4 md:h-4 text-blue-600 focus:ring-blue-500 shrink-0" ${isSelected ? 'checked' : ''} onchange="selectAnswer(${qIndex}, ${oIndex})">
                            <span class="ml-2 md:ml-3 text-xs md:text-sm text-gray-700">${opt}</span>
                            ${iconHtml}
                        </label>
                    `;
                });
                qHtml += `</div></div>`;
            });
            qHtml += `</div>`;
            
            DOM.instructionPanel.innerHTML = qHtml;
            const btnSvg = `<svg class="w-4 h-4 md:w-5 md:h-5 ml-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            DOM.btnNext.innerHTML = `Kiểm tra & Kết luận ${btnSvg}`;
            DOM.btnRetry.classList.add('hidden');
            
            checkQuizCompletion();
        };

        const selectAnswer = (qIndex, oIndex) => {
            state.quizAnswers[qIndex] = oIndex;
            renderQuiz(); 
        };

        const checkQuizCompletion = () => {
            const allAnswered = quizQuestions.every((_, i) => state.quizAnswers[i] !== undefined);
            if (allAnswered) {
                unlockNext();
                DOM.btnNext.onclick = showConclusionModal;
            } else {
                lockNext();
            }
        };

        const showConclusionModal = () => {
            let score = 0;
            quizQuestions.forEach((q, i) => { if(state.quizAnswers[i] === q.ans) score++; });
            stopTimer();

            const modalHtml = `
                <div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
                        <div class="bg-blue-600 p-4 md:p-6 text-white text-center sticky top-0 z-10">
                            <h2 class="text-xl md:text-2xl font-bold uppercase tracking-wider">KẾT LUẬN THÍ NGHIỆM</h2>
                            <p class="mt-1 md:mt-2 text-blue-100 text-sm md:text-base">Thời gian hoàn thành: ${formatTime(state.timer)}</p>
                        </div>
                        <div class="p-4 md:p-8">
                            <div class="text-center mb-4 md:mb-6">
                                <span class="text-3xl md:text-4xl block mb-2">${score === quizQuestions.length ? '🏆' : '👍'}</span>
                                <p class="text-base md:text-lg font-semibold text-gray-800">Điểm bài tập: <span class="text-blue-600">${score}/${quizQuestions.length}</span></p>
                            </div>
                            <div class="bg-green-50 border-l-4 border-green-500 p-3 md:p-4 rounded mb-4 md:mb-6 text-sm md:text-base text-gray-800 leading-relaxed shadow-inner">
                                <strong>Dấu hiệu nhận biết Ion Ammonium (NH₄⁺):</strong><br><br>
                                Cho muối ammonium tác dụng với dung dịch kiềm (như NaOH, KOH) và đun nóng nhẹ. <br><br>
                                <strong>Hiện tượng:</strong> Sẽ sinh ra khí vô cơ không màu, có mùi khai đặc trưng (khí Ammonia - NH₃), khí này làm giấy pH ẩm chuyển sang màu xanh lam.
                            </div>
                            <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 md:py-3 px-4 rounded-xl shadow transition-colors flex items-center justify-center text-sm md:text-base">
                                <svg class="w-4 h-4 md:w-5 md:h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Thực hiện lại thí nghiệm
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };

        const nextStep = () => {
            if (state.step === 2 && (!state.interactions.naohTube1 || !state.interactions.naohTube2)) {
                showMessage("Vui lòng nhỏ dung dịch NaOH vào cả hai ống nghiệm.", true);
                return;
            }
            if (state.step === 3 && (!state.interactions.isHeated1 || !state.interactions.isHeated2)) {
                showMessage("Vui lòng đun nóng cả hai ống nghiệm.", true);
                return;
            }
            if (state.step === 4 && (!state.interactions.phTube1 || !state.interactions.phTube2)) {
                showMessage("Vui lòng thử giấy pH cho cả hai ống nghiệm.", true);
                return;
            }

            state.step++;
            state.selectedTool = null;
            
            if (state.step === 1) startTimer();
            if (state.step === 2 || state.step === 3 || state.step === 4) lockNext(); 
            
            updateToolState();
            renderProgress();
            renderInstruction();
        };

        const retryStep = () => {
            state.selectedTool = null;
            if (state.step === 2) {
                state.interactions.naohTube1 = false;
                state.interactions.naohTube2 = false;
                document.getElementById('liquid-1').setAttribute('height', '96');
                document.getElementById('liquid-1').setAttribute('y', '180');
                document.getElementById('liquid-1').setAttribute('fill', 'rgba(255,255,255,0.15)');
                document.getElementById('liquid-2').setAttribute('height', '96');
                document.getElementById('liquid-2').setAttribute('y', '180');
                document.getElementById('liquid-2').setAttribute('fill', 'rgba(255,255,255,0.15)');
            } else if (state.step === 3) {
                state.interactions.isHeated1 = false;
                state.interactions.isHeated2 = false;
                
                DOM.rackBack.style.opacity = '1';
                DOM.rackFront.style.opacity = '1';
                DOM.tube1.classList.remove('tilted-tube');
                DOM.tube2.classList.remove('tilted-tube');

                // Ẩn toàn bộ kẹp gỗ
                document.getElementById('clamp-back-1').classList.add('hidden');
                document.getElementById('clamp-front-1').classList.add('hidden');
                document.getElementById('clamp-back-2').classList.add('hidden');
                document.getElementById('clamp-front-2').classList.add('hidden');
                
                DOM.burnerArea1.classList.add('hidden', 'opacity-0');
                DOM.burnerArea1.classList.remove('shifted-burner');
                DOM.burnerArea2.classList.add('hidden', 'opacity-0');
                DOM.burnerArea2.classList.remove('shifted-burner');
                DOM.flameSvg1.classList.add('hidden');
                DOM.flameSvg2.classList.add('hidden');
                DOM.gasContainer.innerHTML = '';
            } else if (state.step === 4) {
                state.interactions.phTube1 = false;
                state.interactions.phTube2 = false;
                DOM.phResult1.classList.add('hidden');
                DOM.phResult1.classList.remove('flex');
                DOM.phResult2.classList.add('hidden');
                DOM.phResult2.classList.remove('flex');
                DOM.phStrip2.classList.replace('bg-blue-800', 'bg-[#fbbf24]');
                DOM.phStrip2.classList.replace('border-blue-900', 'border-gray-600');
                DOM.phStrip2.classList.remove('glow-blue');
            }
            updateToolState();
            renderInstruction();
            showMessage("Đã đặt lại trạng thái bước này.");
        };

        window.resetLab = () => {
            state.step = 0;
            state.timer = 0;
            stopTimer();
            state.timerInterval = null;
            state.selectedTool = null;
            state.interactions = {
                naohTube1: false,
                naohTube2: false,
                isHeated1: false,
                isHeated2: false,
                phTube1: false,
                phTube2: false
            };
            state.quizAnswers = {};
            
            DOM.timer.innerText = "00:00";
            
            // Reset UI
            document.getElementById('liquid-1').setAttribute('height', '96');
            document.getElementById('liquid-1').setAttribute('y', '180');
            document.getElementById('liquid-1').setAttribute('fill', 'rgba(255,255,255,0.15)');
            document.getElementById('liquid-2').setAttribute('height', '96');
            document.getElementById('liquid-2').setAttribute('y', '180');
            document.getElementById('liquid-2').setAttribute('fill', 'rgba(255,255,255,0.15)');
            
            DOM.rackBack.style.opacity = '1';
            DOM.rackFront.style.opacity = '1';
            DOM.tube1.classList.remove('tilted-tube');
            DOM.tube2.classList.remove('tilted-tube');

            document.getElementById('clamp-back-1').classList.add('hidden');
            document.getElementById('clamp-front-1').classList.add('hidden');
            document.getElementById('clamp-back-2').classList.add('hidden');
            document.getElementById('clamp-front-2').classList.add('hidden');
            
            DOM.burnerArea1.classList.add('hidden', 'opacity-0');
            DOM.burnerArea1.classList.remove('shifted-burner');
            DOM.burnerArea2.classList.add('hidden', 'opacity-0');
            DOM.burnerArea2.classList.remove('shifted-burner');
            DOM.flameSvg1.classList.add('hidden');
            DOM.flameSvg2.classList.add('hidden');
            DOM.gasContainer.innerHTML = '';
            
            DOM.phResult1.classList.add('hidden');
            DOM.phResult1.classList.remove('flex');
            DOM.phResult2.classList.add('hidden');
            DOM.phResult2.classList.remove('flex');
            DOM.phStrip2.classList.replace('bg-blue-800', 'bg-[#fbbf24]');
            DOM.phStrip2.classList.replace('border-blue-900', 'border-gray-600');
            DOM.phStrip2.classList.remove('glow-blue');
            
            DOM.btnNext.onclick = nextStep;
            
            updateToolState();
            init();
            showMessage("Đã tạo lại phòng thí nghiệm!");
        };

        const init = () => {
            renderProgress();
            DOM.instructionPanel.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-center animate-fade-in">
                    <div class="w-16 h-16 md:w-24 md:h-24 bg-blue-100 rounded-full flex items-center justify-center mb-4 md:mb-6 shadow-inner shrink-0">
                        <svg class="w-8 h-8 md:w-12 md:h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    </div>
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">Chào mừng đến với Thí nghiệm ảo!</h2>
                    <p class="text-sm md:text-base text-gray-600 mb-4 md:mb-8 max-w-md">Ứng dụng này sẽ hướng dẫn bạn cách nhận biết sự có mặt của ion Ammonium trong phân đạm thông qua các phản ứng hóa học đặc trưng.</p>
                </div>
            `;
            DOM.btnRetry.classList.add('hidden');
        };

        window.onload = init;
    </script>
</body>
</html>
